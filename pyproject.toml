[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "geostat"
version = "0.1.0"
description = "GeoStat - reproducible satellite flood mapping and infrastructure exposure analysis"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "GeoStat" }]
dependencies = [
  "numpy>=1.26,<2.3",
  "rasterio>=1.4,<1.5",
  "pyproj>=3.6,<4",
  "shapely>=2.1,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "torch>=2.6,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "mypy>=2.4,<3",
  "ruff>=0.17,<0.18",
]

[project.scripts]
geostat = "geostat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/geostat"]

[tool.hatch.build.targets.wheel.force-include]
"frontend" = "geostat/frontend"
"configs" = "geostat/configs"

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]

[[tool.mypy.overrides]]
module = ["rasterio", "rasterio.*", "shapely", "shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: tests that need downloaded data (opt-in)",
  "gpu: tests that require a CUDA GPU",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
