name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python: ['3.12', '3.13']
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.9'
          enable-cache: true
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest --basetemp "${{ runner.temp }}/GeoStat tests ü"
      - run: uv run --no-sync geostat --help

  real-data-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.9'
          enable-cache: true
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run --no-sync pytest tests/test_real_data_smoke.py
        env:
          GEOSTAT_REAL_DATA_SMOKE: '1'
