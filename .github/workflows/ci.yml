name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.9'
          enable-cache: true
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest --basetemp "${{ runner.temp }}/GeoStat tests ü"
      - run: uv run --no-sync geostat --help
      - run: uv run --no-sync python scripts/benchmark_spatial.py --worker raster-windowed --size small

      - name: Install the project wheel
        run: uv sync --locked --extra dev --no-editable --python ${{ matrix.python }}
      - name: Check the installed CLI outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          GEOSTAT_DATA_DIR: ${{ runner.temp }}/GeoStat wheel data
          GEOSTAT_ARTIFACTS_DIR: ${{ runner.temp }}/GeoStat wheel artifacts
        run: uv run --project "${{ github.workspace }}" --no-sync geostat doctor --json
      - name: Check the installed API and packaged frontend
        working-directory: ${{ runner.temp }}
        env:
          GEOSTAT_DATA_DIR: ${{ runner.temp }}/GeoStat wheel data
          GEOSTAT_ARTIFACTS_DIR: ${{ runner.temp }}/GeoStat wheel artifacts
        run: >-
          uv run --project "${{ github.workspace }}" --no-sync python -c
          "from geostat import settings; from geostat.api import create_app;
          from fastapi.testclient import TestClient;
          assert settings.FRONTEND_DIR == settings.PKG_DIR / 'frontend';
          client = TestClient(create_app());
          assert client.get('/api/health').json()['ok'];
          assert client.get('/').status_code == 200"

  real-data-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.9'
          enable-cache: true
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run --no-sync pytest tests/test_real_data_smoke.py
        env:
          GEOSTAT_REAL_DATA_SMOKE: '1'

  export-benchmark:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.9'
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: uv run --no-sync python scripts/benchmark_export.py --size 512 2048 --repeats 2 --output export-benchmark.json
      - run: uv run --no-sync python scripts/benchmark_polygonization.py --size 8192 --pattern islands holes --verify --output polygonization-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: export-benchmark-${{ matrix.os }}
          path: |
            export-benchmark.json
            polygonization-benchmark.json
          if-no-files-found: error
          retention-days: 14
